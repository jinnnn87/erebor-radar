name: Notion Database Auto-Sync

on:
  schedule:
    # 매 시간 정각에 자동 동기화 (UTC 기준)
    - cron: '0 * * * *'
  workflow_dispatch:
    # GitHub Actions 탭에서 [Run workflow] 버튼으로 즉시 실행 가능

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Notion Sync Script
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: |
          python scripts/sync_notion.py

      - name: Commit and Push if Changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/portfolioData.json
          if git diff --staged --quiet; then
            echo "No changes detected in portfolioData.json."
          else
            git commit -m "chore(data): auto-sync portfolio data from Notion [skip ci]"
            git push origin main
            echo "Successfully committed and pushed updated portfolio data."
          fi
